apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk
  labels:
    app: helpdesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helpdesk
  template:
    metadata:
      labels:
        app: helpdesk
    spec:
      containers:
        - name: helpdesk
          image: ghcr.io/gofreego/helpdesk:pilot-58bb012
          imagePullPolicy: Always
          command:
            - /app/application
          args:
            - -env=prod
            - -path=/etc/helpdesk/config
          ports:
            - name: http
              containerPort: 80
            - name: grpc
              containerPort: 8081
          volumeMounts:
            - name: config
              mountPath: /etc/helpdesk/config
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          secret:
            # Created out-of-band from the private configs-prod repo, not by
            # anything in this repo's own manifests - see infra's
            # helpdesk-config-secret role.
            secretName: helpdesk-config
