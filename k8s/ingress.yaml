# Pilot-only internal hostname — no real public hostname for this service
# directly, purely for validating the deployment via curl --resolve.
# Reachable in real use via opengate's /helpdesk/ route and admin's
# /helpdesk/ path (once added there too).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helpdesk
spec:
  ingressClassName: nginx
  rules:
    - host: helpdesk-pilot.bappaapp.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helpdesk
                port:
                  name: http
